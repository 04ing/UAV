services:
  # ============ 后端应用 ============
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uav-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=4000
      - JWT_SECRET=${JWT_SECRET:-drone-inspection-demo-secret-2026}
      - JWT_EXPIRES_IN=8h
      - DJI_APP_KEY=${DJI_APP_KEY:-}
      - DJI_APP_SECRET=${DJI_APP_SECRET:-}
      - DJI_API_URL=${DJI_API_URL:-https://api.dji.com}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - YOLO_SERVER_URL=http://yolo:8080
    volumes:
      # 数据持久化
      - app-data:/app/data/store
      - app-logs:/app/logs
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/healthz',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - uav-net

  # ============ Nginx 反向代理 ============
  nginx:
    image: nginx:alpine
    container_name: uav-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - uav-net

  # ============ YOLO 推理服务（可选）============
  yolo:
    build:
      context: .
      dockerfile: Dockerfile.yolo
    container_name: uav-yolo
    restart: unless-stopped
    ports:
      - "${YOLO_PORT:-8080}:8080"
    volumes:
      - ./data.yaml:/app/data.yaml:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    profiles:
      - gpu   # 仅 docker compose --profile gpu up 时启动
    networks:
      - uav-net

volumes:
  app-data:
  app-logs:

networks:
  uav-net:
    driver: bridge
